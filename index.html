<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Shubh Dhanteras</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: radial-gradient(circle, #2a0808, #000000);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
        }

        .ambient-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(212,175,55,0.2) 0%, rgba(0,0,0,0) 70%);
            animation: pulse 4s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.4; }
            100% { transform: scale(1.5); opacity: 0.8; }
        }

        .stage {
            z-index: 1;
            text-align: center;
            width: 90%;
            max-width: 700px;
        }

        .gift-box {
            font-size: 8rem;
            cursor: pointer;
            animation: bounce 2s infinite ease-in-out;
            display: inline-block;
            filter: drop-shadow(0 0 20px rgba(212,175,55,0.5));
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .gift-box.open {
            animation: popOut 0.5s forwards;
        }

        @keyframes popOut {
            to { transform: scale(0); opacity: 0; }
        }

        .message-container {
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .wish-line {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(212,175,55,0.8);
            opacity: 0;
            transform: translateY(20px);
            margin: 10px 0;
            position: absolute;
        }

        .marquee-bg {
            position: absolute;
            bottom: 20px;
            width: 100%;
            color: rgba(255, 215, 0, 0.1);
            font-size: 2rem;
            white-space: nowrap;
            overflow: hidden;
            pointer-events: none;
        }

        .marquee-bg div {
            display: inline-block;
            animation: scroll 20s linear infinite;
        }

        @keyframes scroll {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        .sparkle {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            pointer-events: none;
            animation: burst 1s ease-out forwards;
        }

        @keyframes burst {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(2) translate(var(--tx), var(--ty)); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="marquee-bg">
        <div>✨ शुभ धनतेरस ✨ माता लक्ष्मी की कृपा बनी रहे ✨ कुबेर देव का आशीर्वाद मिले ✨</div>
    </div>

    <div class="stage">
        <div class="gift-box" id="gift" onclick="openGift()">🎁</div>
        <div class="message-container" id="container"></div>
    </div>

    <script>
        const wishes = [
            "✨ शुभ धनतेरस! ✨",
            "माता लक्ष्मी और भगवान धन्वंतरि आपके घर आएं,",
            "सुख, समृद्धि और धन की वर्षा कर जाएं!",
            "स्वास्थ्य ही सबसे बड़ा धन है,",
            "आपका हर दिन मंगलमय हो! 🪔"
        ];

        function openGift() {
            const gift = document.getElementById("gift");
            gift.classList.add("open");

            setTimeout(() => {
                displayWishes();
            }, 500);
        }

        async function displayWishes() {
            const container = document.getElementById("container");
            
            for (let text of wishes) {
                const line = document.createElement("div");
                line.className = "wish-line";
                line.innerText = text;
                container.appendChild(line);

                // Animate in
                line.style.transition = "all 0.8s ease-out";
                line.style.opacity = "1";
                line.style.transform = "translateY(0)";

                create Sparks();

                await new Promise(r => setTimeout(r, 2500));

                // Animate out
                line.style.opacity = "0";
                line.style.transform = "translateY(-20px)";
                
                await new Promise(r => setTimeout(r, 800));
                line.remove();
            }
        }

        function create Sparks() {
            for (let i = 0; i < 20; i++) {
                const s = document.createElement("div");
                s.className = "sparkle";
                
                const size = Math.random() * 10 + 5;
                s.style.width = size + "px";
                s.style.height = size + "px";
                
                s.style.left = "50%";
                s.style.top = "50%";
                
                const ang = Math.random() * Math.PI * 2;
                const dist = Math.random() * 200 + 50;
                
                s.style.setProperty('--tx', `${Math.cos(ang) * dist}px`);
                s.style.setProperty('--ty', `${Math.sin(ang) * dist}px`);
                
                document.body.appendChild(s);
                setTimeout(() => s.remove(), 1000);
            }
        }
    </script>
</body>
</html>
