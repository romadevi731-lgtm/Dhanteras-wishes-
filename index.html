<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Shubh Dhanteras</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: radial-gradient(circle, #2a0808, #000000);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
        }

        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(212,175,55,0.25) 0%, rgba(0,0,0,0) 70%);
            animation: pulse 4s infinite alternate;
            pointer-events: none;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.4; }
            100% { transform: scale(1.4); opacity: 0.8; }
        }

        .stage {
            z-index: 1;
            text-align: center;
            width: 90%;
            max-width: 800px;
        }

        .gift-box {
            font-size: 8rem;
            cursor: pointer;
            animation: bounce 2s infinite ease-in-out;
            display: inline-block;
            filter: drop-shadow(0 0 25px rgba(212,175,55,0.6));
            transition: transform 0.3s ease;
        }

        .gift-box:hover {
            transform: scale(1.05);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .gift-box.open {
            animation: popOut 0.6s forwards;
        }

        @keyframes popOut {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
            100% { transform: scale(0); opacity: 0; }
        }

        .message-container {
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .wish-line {
            font-size: 3rem;
            font-weight: 800;
            color: #ffd700;
            text-shadow: 0 0 25px rgba(212,175,55,0.9), 0 0 50px rgba(255,255,255,0.3);
            opacity: 0;
            position: absolute;
            text-align: center;
            width: 100%;
        }

        .sparkle {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 15px #fff;
        }

        @keyframes burst {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="stage">
        <div class="gift-box" id="gift" onclick="openGift()">🎁</div>
        <div class="message-container" id="container"></div>
    </div>

    <script>
        const wishes = [
            "✨ शुभ धनतेरस! ✨",
            "माता लक्ष्मी और भगवान धन्वंतरि आपके घर आएं,",
            "सुख, समृद्धि और धन की वर्षा कर जाएं!",
            "स्वास्थ्य ही सबसे बड़ा धन है,",
            "आपका हर दिन मंगलमय हो! 🪔"
        ];

        function openGift() {
            const gift = document.getElementById("gift");
            gift.onclick = null; // Prevent multiple clicks
            gift.classList.add("open");

            setTimeout(() => {
                displayWishes();
            }, 600);
        }

        async function displayWishes() {
            const container = document.getElementById("container");
            
            for (let text of wishes) {
                const line = document.createElement("div");
                line.className = "wish-line";
                line.innerText = text;
                container.appendChild(line);

                // Fade in
                line.style.transition = "opacity 0.8s ease-in, transform 0.8s ease-out";
                line.style.opacity = "1";

                createSparkles();

                await new Promise(r => setTimeout(r, 3000));

                // Fade out
                line.style.opacity = "0";
                line.style.transform = "scale(0.9)";
                
                await new Promise(r => setTimeout(r, 800));
                line.remove();
            }
        }

        function createSparkles() {
            for (let i = 0; i < 30; i++) {
                const s = document.createElement("div");
                s.className = "sparkle";
                
                const size = Math.random() * 12 + 6;
                s.style.width = size + "px";
                s.style.height = size + "px";
                
                const stage = document.querySelector('.stage');
                const rect = stage.getBoundingClientRect();
                const startX = rect.width / 2;
                const startY = rect.height / 2;
                
                s.style.left = startX + "px";
                s.style.top = startY + "px";
                
                const ang = Math.random() * Math.PI * 2;
                const dist = Math.random() * 300 + 50;
                
                s.style.setProperty('--tx', `${Math.cos(ang) * dist}px`);
                s.style.setProperty('--ty', `${Math.sin(ang) * dist}px`);
                
                s.style.animation = `burst 1.2s ease-out forwards`;
                
                stage.appendChild(s);
                setTimeout(() => s.remove(), 1200);
            }
        }
    </script>
</body>
</html>
